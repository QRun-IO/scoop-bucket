name: Qualify original Scoop bucket commands
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    name: Original Scoop tests and READ-only updater capture
    runs-on: qqq-windows-vm6218
    timeout-minutes: 30
    steps:
      - uses: builtin:checkout
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare job-local original dependencies
        uses: self:KofTwentyTwo/platform-ci/scoop-original@07fac2a44545ebb1a3a6b967ae28b5fd18f87f39
        with: {stage: Prepare}
      - name: Original Windows PowerShell5.1 test command
        uses: self:KofTwentyTwo/platform-ci/scoop-original@07fac2a44545ebb1a3a6b967ae28b5fd18f87f39
        with: {stage: Test, shell: powershell}
      - name: Original PowerShell Core test command
        uses: self:KofTwentyTwo/platform-ci/scoop-original@07fac2a44545ebb1a3a6b967ae28b5fd18f87f39
        with: {stage: Test, shell: pwsh}
      - name: Original updater capture only
        id: capture
        uses: self:KofTwentyTwo/platform-ci/scoop-original@07fac2a44545ebb1a3a6b967ae28b5fd18f87f39
        with: {stage: Capture}
      - uses: self:KofTwentyTwo/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-scoop-updates
          path: ${{ steps.capture.outputs.capture-dir }}/updates.json
          if-no-files-found: error
          retention-days: 3
