name: Pull Requests
on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
jobs:
  handler:
    if: (github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository) || (github.event_name == 'issue_comment' && github.event.action == 'created' && (github.event.issue.pull_request || github.event.is_pull == true) && startsWith(github.event.comment.body, '/verify'))
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: self:KofTwentyTwo/platform-ci/.gitea/workflows/scoop-pr.yaml@qrun-release-v1
