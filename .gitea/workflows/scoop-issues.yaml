name: Issues
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: read
  actions: read
jobs:
  handler:
    if: github.event_name == 'issues' && (github.event.action == 'opened' || ((github.event.action == 'labeled' || (github.event.action == 'label_updated' && github.event.changes.added_labels[0] != null)) && contains(github.event.issue.labels.*.name, 'verify')))
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
    uses: self:KofTwentyTwo/platform-ci/.gitea/workflows/scoop-issues.yaml@qrun-release-v1
